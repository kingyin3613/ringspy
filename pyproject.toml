[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ringspy"
dynamic = ["version"]
description = "A geometric generation tool for prismatic cellular solids, and lattice reconstruction from 3D images"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Hao Yin", email = "haoyin2022@u.northwestern.edu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib>=3.2.2",
    "tomli>=1.1; python_version < '3.11'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
ringspy = "ringspy.cli:main"

[project.optional-dependencies]
vtk = ["vtk"]                       # no longer needed: the STL file is written without VTK since v2.2 (kept for old commands)
hex = ["hexalattice>=1.2.1"]        # radial_growth_rule = 'regular_hexagonal'
image = ["tifffile"]                # ringspy reconstruct: 3D images as .tif stacks
all = ["hexalattice>=1.2.1", "tifffile"]
test = ["pytest>=7", "pytest-cov", "hexalattice>=1.2.1", "tifffile"]

[project.urls]
Homepage = "https://github.com/kingyin3613/ringspy"
Paper = "https://doi.org/10.21105/joss.04945"

[tool.setuptools]
packages = ["ringspy"]

[tool.setuptools.dynamic]
version = { attr = "ringspy.__version__" }

[tool.setuptools.package-data]
ringspy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs of the examples (skip them with: pytest -m 'not slow')"]
