# RingsPy example: the dog-bone specimen of dogbone.toml, with its outline read from an SVG drawing
#
#   ringspy run dogbone_svg.toml
#
# box_polygon names an SVG or DXF file (relative to this file) instead of listing the vertices: the drawing's
# outline (its path, polygon, rect, circle or polyline of largest area; a DXF's closed polyline or loop of lines
# and arcs) is read in mm, simplified to box_polygon_tolerance and centred on box_center. The same mesh as
# dogbone.toml, since dogbone.svg holds the same vertices. Lengths in mm.

geoName = "dogbone_svg"
path = "meshes"
seed = 2024

radial_growth_rule = "binary"
iter_max = 500
r_min = 0
r_max = 4
nrings = 4
generation_center = [0, 0]
cellsize_sparse = 0.02
cellsize_dense = 0.01
cellwallthickness_sparse = 0.006
cellwallthickness_dense = 0.010

# Clipping outline from a drawing
boundaryFlag = true
box_shape = "polygon"
box_polygon = "dogbone.svg"     # SVG or DXF file; `ringspy outline dogbone.svg` prints the vertices it gives
box_polygon_tolerance = 0.01    # simplification tolerance (mm): no edge shorter than merge_tol
box_center = [0.6, 0.0]         # the outline is centred here (dogbone.toml's polygon is centred on (0.6, 0))

nsegments = 2
theta_min = 0
theta_max = 0.05
z_min = 0
z_max = 1.0

merge_operation = true
merge_tol = 0.01

stlFlag = false
inpFlag = true
inpType = "Abaqus"
