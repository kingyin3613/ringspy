# RingsPy example: dog-bone tensile specimen cut from a wood log with growth rings
#
#   ringspy run dogbone.toml
#
# box_shape = "polygon" clips the cells with any simple polygon, also a non-convex one like this.
# Lengths in mm. Parameters left out take their default values (those of wood_cube.toml).

geoName = "dogbone"
path = "meshes"
seed = 2024

# Cell placement and growth rings
radial_growth_rule = "binary"
iter_max = 500
r_min = 0
r_max = 4
nrings = 4
generation_center = [0, 0]
cellsize_sparse = 0.02
cellsize_dense = 0.01
cellwallthickness_sparse = 0.006
cellwallthickness_dense = 0.010

# Clipping polygon: vertices [[x, y], ...] in any order around the polygon (clockwise or not)
boundaryFlag = true
box_shape = "polygon"
box_polygon = [[-1.2, -0.8], [-0.5, -0.8], [-0.1, -0.4], [1.3, -0.4], [1.7, -0.8], [2.4, -0.8],
               [2.4, 0.8], [1.7, 0.8], [1.3, 0.4], [-0.1, 0.4], [-0.5, 0.8], [-1.2, 0.8]]

# Longitudinal direction: a plate 1 mm thick (left out, z_max is z_min + the largest width of the polygon)
nsegments = 2
theta_min = 0
theta_max = 0.05
z_min = 0
z_max = 1.0

merge_operation = true
merge_tol = 0.01

stlFlag = true
inpFlag = true
inpType = "Abaqus"
